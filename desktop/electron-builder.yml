#  electron-builder configuration — The Curator desktop shell
#
#  ╔═════════════════════════════════════════════════════════════════════════╗
#  ║  RUN FOR REAL on 2026-08-31 with electron-builder 26.15.3 / electron    ║
#  ║  43.5.0. It produced one .app and two .dmgs, and the .app runs from     ║
#  ║  /Applications.                                                          ║
#  ║                                                                          ║
#  ║  The `files` mapping WAS the thing that broke, exactly as this banner    ║
#  ║  predicted — and it broke in a way that still LAUNCHED. Read the long    ║
#  ║  note above `files:` before touching it. See desktop/README.md.          ║
#  ╚═════════════════════════════════════════════════════════════════════════╝

appId: com.talirezun.the-curator
productName: The Curator
copyright: Copyright © Tali Rezun

directories:
  # electron-builder runs from `desktop/`, so output lands in desktop/dist/.
  # .gitignore covers it — see the "desktop build output" block there.
  output: dist

# ─────────────────────────────────────────────────────────────────────────────
#  THE VERSION GUARD — do not remove this line without reading lib/app-version.js
#
#  The first packaged build shipped an About panel reading `0.0.0 (0.0.0)`,
#  because electron-builder derives CFBundleShortVersionString and
#  CFBundleVersion from the app manifest's `version`, and desktop/package.json
#  is pinned at 0.0.0. The DMGs were then RENAMED BY HAND at upload time, so
#  the filename said 3.30.0 and the app inside said 0.0.0.
#
#  The version now comes from the ROOT package.json — the field
#  scripts/release.js already moves in lockstep with package-lock.json and
#  CLAUDE.md — injected as `--config.extraMetadata.version` by
#  `npm run dist` (lib/dist.js) and by .github/workflows/desktop-dmg.yml.
#
#  This hook is the part that makes a wrong version IMPOSSIBLE rather than
#  merely unlikely. It runs after the .app is packed and before any .dmg
#  exists, reads the REAL Info.plist off disk, and THROWS if either version key
#  disagrees with the root manifest or is still the 0.0.0 sentinel. Verified
#  against electron-builder 26.15.3's own source: `AsyncEventEmitter.emit`
#  awaits user hooks with no try/catch, so the throw aborts the build.
#
#  It fires for `npm run dist`, for the CI workflow, and for a hand-typed
#  `npx electron-builder --mac` — electron-builder auto-discovers this file in
#  the working directory even with no `--config`. What it cannot cover is a
#  DIFFERENT config file or an explicit `--config.afterPack=null`; those are
#  deliberate acts. The path it closes is the one that actually shipped:
#  forgetting the version entirely.
#
#  The path is relative to desktop/ (electron-builder resolves hook paths
#  against its working directory, and refuses any that escape the workspace
#  root).
#
#  SINCE THE SIGNING FIX the hook also applies and PROVES a valid ad-hoc
#  signature — see lib/adhoc-sign.mjs. `identity: null` below stays exactly as
#  it was, and the reason is measured rather than assumed: `identity: '-'` would
#  re-open keychain auto-discovery, because electron-builder matches a qualifier
#  as a bare SUBSTRING of each keychain line and `CSC_IDENTITY_AUTO_DISCOVERY`
#  is not consulted on that branch.
# ─────────────────────────────────────────────────────────────────────────────
afterPack: ./lib/after-pack.mjs

# ─────────────────────────────────────────────────────────────────────────────
#  afterSign — WINDOWS ONLY, a no-op everywhere else (2026-11-20).
#
#  electron-builder writes the Windows exe's icon and version resource in its
#  sign step, which runs AFTER afterPack, so "the exe says the right version"
#  can only be checked here. lib/win-pack.mjs `afterSign` returns at once
#  unless electronPlatformName is 'win32', so the Mac build is unchanged (the
#  hook does run on a Mac build, because `asar: false` makes electron-builder
#  report signing as done; it reads nothing and writes nothing there).
#  On win32 it refuses an exe whose FileVersion/ProductVersion is not the root
#  package.json's version (or is 0.0.0), and one whose RunAsNode fuse is off:
#  Claude Desktop starts the MCP bridge as `The Curator.exe` with
#  ELECTRON_RUN_AS_NODE=1, which needs that fuse ON.
# ─────────────────────────────────────────────────────────────────────────────
afterSign: ./lib/win-pack.mjs

# ─────────────────────────────────────────────────────────────────────────────
#  asar: FALSE — a deliberate departure from the plan, argued rather than
#  assumed. The plan frames asar as a thing to CONFIGURE, via
#  `asarUnpack: mcp/**`. That addresses ONE of three independent hazards, and
#  not the worst one.
#
#  (a) EVERY Personal Sync git call fails. VERIFIED IN THE SOURCE, not assumed:
#
#          src/brain/sync.js:21   const ROOT = APP_ROOT;
#          src/brain/sync.js:125  cwd: ROOT,  // "Explicit cwd prevents
#                                             //  getcwd: Operation not
#                                             //  permitted on macOS"
#          src/brain/paths.js:194 export const APP_ROOT =
#                                   path.resolve(__dirname, '../..')
#
#      Inside an archive, `__dirname` for src/brain/sync.js is
#      …/Resources/app.asar/src/brain, so APP_ROOT resolves to
#      …/Resources/app.asar — which is a FILE on the real filesystem. Electron
#      patches `fs` inside its own process; it does NOT patch the kernel. A
#      child process gets its cwd from a real chdir, so `execAsync(... {cwd})`
#      fails before git is even reached. `src/routes/config.js:2322` uses the
#      identical `cwd: PROJECT_ROOT` (also APP_ROOT) for the updater's git
#      calls, so the same defect hits both.
#
#      `asarUnpack` does not help. Unpacking moves the BYTES to
#      app.asar.unpacked/, but the module is still resolved through the
#      app.asar path, so `__dirname` — and therefore APP_ROOT, and therefore
#      the cwd handed to a child process — is unchanged. Fixing it inside asar
#      means teaching APP_ROOT to rewrite `.asar` → `.asar.unpacked`, i.e. a
#      change in `src/brain/paths.js`, which this change does not own and
#      which would be a poor first move: it makes a path constant that every
#      other module depends on conditional on packaging.
#
#  (b) `appPath('mcp', 'server.js')` is written into Claude Desktop's own
#      config file. Claude Desktop is an EXTERNAL process with no asar
#      support, so it would be handed a path inside an archive it cannot open.
#      `asarUnpack: mcp/**` moves the bytes but not the emitted path string,
#      so this too needs a code change to be correct under asar.
#
#  (c) `src/brain/ingest.js:268` does
#      `await import('pdf-parse/lib/pdf-parse.js')` — a DYNAMIC ESM import.
#      Electron's asar support is built around CommonJS `require`; the ESM
#      loader is a separate path and dynamic import of a file inside an
#      archive is not a road worth being on for a first build.
#
#  `asar: false` removes all three AT ONCE, for some startup milliseconds and
#  a larger bundle. The source is MIT in a public repository, so "readable
#  inside the app" costs nothing that is not already true of `git clone`.
#
#  WHEN TO REVISIT: once (a) and (b) have real fixes in `src/` with their own
#  guards. Not before, and not as a size optimisation.
# ─────────────────────────────────────────────────────────────────────────────
asar: false

# ─────────────────────────────────────────────────────────────────────────────
#  files — VERIFIED BY BUILDING, 2026-08-31, electron-builder 26.15.3.
#
#  The packaged app root must end up FLAT, like this:
#
#      Contents/Resources/app/
#        package.json        ← this project's (main: "main.js")
#        main.js  preload.js  lib/
#        src/**  mcp/**  node_modules/**
#
#  because two independent derivations have to agree on where the app root is:
#  `desktop/main.js` probes for `src/server.js` beside itself, and
#  `src/brain/paths.js` computes `path.resolve(__dirname, '../..')`. In the
#  layout above both land on `app/`. Nest `src/` one level deeper and they
#  disagree, which presents as an empty wiki rather than as an error.
#
#  MEASURED: the flat layout below is what a real build produces. `src/`,
#  `mcp/`, `LICENSE` and `LICENSES/` all arrive as siblings of `main.js`, and
#  the app root is `Contents/Resources/app`, exactly as intended.
#
#  ── node_modules IS NOT LISTED HERE, AND THAT IS THE FIX ────────────────────
#
#  It used to carry a `node_modules/**/*` line in the filter below. That line
#  DID NOTHING, and the failure it produced is the worst shape available:
#
#    electron-builder does not treat node_modules as ordinary files. It
#    computes the PRODUCTION DEPENDENCY TREE from the app manifest's
#    `dependencies` and copies that, ignoring a user glob. `desktop/package.json`
#    deliberately has no `dependencies`, so the computed tree is EMPTY — the
#    build logs `no node modules returned while searching directories` and
#    ships an app root with no node_modules at all.
#
#  The reason this was not caught by simply launching the built app is worth
#  writing down, because it will fool the next person too:
#
#    THE BROKEN BUILD LAUNCHES FINE AS LONG AS IT SITS INSIDE THE CHECKOUT.
#    Node resolves a bare specifier by walking UP the directory tree, so from
#    …/desktop/dist/mac-arm64/The Curator.app/Contents/Resources/app/src/server.js
#    it climbs out of the bundle, out of dist/, out of desktop/, and finds the
#    REPO ROOT's node_modules. The app starts, serves, and renders. Copy the
#    same bundle to /Applications and it dies on
#    `ERR_MODULE_NOT_FOUND: Cannot find package 'dotenv'` — which `main.js`
#    catches and reports through `fatal()`'s error dialog. Verified both ways.
#
#  So the tree is copied EXPLICITLY, as a resource, to the exact path the flat
#  layout needs. `extraResources.to` is relative to `Contents/Resources`, so
#  `app/node_modules` lands beside `src/` and `main.js`.
#
#  It still comes from the REPO ROOT rather than a second install under
#  `desktop/`, because the runtime deps belong to the app, not to the shell —
#  duplicating the eight dependency ranges into a second manifest is how the
#  two drift. This is safe in a way it usually is not: the root manifest has
#  EIGHT dependencies and ZERO devDependencies, so there is no dev tree to
#  accidentally ship. That property is asserted by
#  scripts/test-desktop-packaging.js; if it ever stops being true, this line
#  starts shipping a dev tree to users.
# ─────────────────────────────────────────────────────────────────────────────
files:
  - package.json
  - main.js
  - preload.js
  - lib/**/*
  - from: ..
    to: .
    filter:
      - src/**/*
      - mcp/**/*
      # v3.77.0 — the two agent skills, so the app can compare installed
      # copies file by file (Setup check) and hand out a current .zip
      # without a repository checkout. Markdown only, ~40 KB.
      - skills/**/*
      - LICENSE
      - LICENSES/**/*
      # NOT the repo root's package.json — the packaged app must keep THIS
      # project's manifest, whose `main` points at main.js. Copying the root
      # one over it produces an app whose entry point is src/server.js, i.e.
      # a headless server with no window and no explanation.
      - '!package.json'
      - '!package-lock.json'
      # Never ship the maintainer's data, credentials, or git history.
      - '!domains/**/*'
      - '!.git/**/*'
      - '!**/.env'
      - '!**/.curator-config.json'
      - '!**/.sync-config.json'
      - '!**/.sharedbrain-config.json'
      - '!**/.knowledge-git/**/*'

# The app's runtime dependency tree, placed at the one path the flat layout
# needs. See the long note above `files` for why a `files` glob cannot do this.
# `from` is relative to desktop/; `to` is relative to Contents/Resources.
extraResources:
  - from: ../node_modules
    to: app/node_modules
    filter:
      - '**/*'
      # A stray .env inside a dependency would be shipped verbatim otherwise.
      - '!**/.env'

mac:
  category: public.app-category.productivity
  # Without this, electron-builder falls back to build/icon.icns (absent here)
  # and then to its own default Electron icon — every packaged .app would ship
  # the generic Electron mark rather than The Curator's. `images/applet.icns`
  # is a REPO-ROOT asset shared with the AppleScript build (scripts/build-app.sh),
  # not desktop-specific, so it is referenced relative to this file (desktop/)
  # rather than copied into desktop/build/.
  icon: ../images/applet.icns
  # Both architectures as SEPARATE artifacts, not a universal binary: a
  # universal build doubles the download for every user to serve the other
  # half's chip.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # ── CERTIFICATE SIGNING IS NOT CONFIGURED, AND THAT IS THE POINT ──────────
  # Apple Developer enrolment, the Developer ID certificate, the hardened
  # runtime, the entitlements file and notarization are ALL out of scope here.
  # Nothing in this file references a certificate, a team, an Apple ID or an
  # app-specific password, and NO SUCH VALUE MAY EVER BE WRITTEN INTO THIS
  # FILE — the repository is public.
  #
  # When signing does land, it arrives as GitHub Actions secrets consumed by
  # electron-builder's own environment variables (CSC_LINK, CSC_KEY_PASSWORD,
  # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID) — set in the
  # workflow from `secrets.*`, never committed, and never echoed.
  #
  # THE BUILD IS NOT UNSIGNED, AND THAT WORD USED TO SIT HERE. What ships is
  # AD-HOC signed, by the `afterPack` hook at the top of this file: an Electron
  # bundle straight out of the packer carries only a linker-signed stub and is
  # rejected by `codesign --verify --deep --strict`, so lib/adhoc-sign.mjs
  # re-seals it and PROVES the result — and refuses the build if a real
  # certificate ever turns up on it. Ad hoc means no certificate, no team and
  # no notarization; it is not the absence of a signature.
  #
  # `identity: null` is what keeps electron-builder itself out of that. Without
  # it, it auto-discovers any identity in the developer's own keychain and
  # silently produces a certificate-signed artifact that works on exactly one
  # Mac — the most misleading possible outcome. `identity: '-'` would NOT be
  # an equivalent way to ask for ad hoc: electron-builder matches a qualifier
  # as a bare substring of each keychain line, which re-opens exactly that
  # discovery. Measured, not assumed — see the afterPack block above.
  identity: null

  # ── Hardened runtime + entitlements: WRITTEN NOW, INERT UNTIL SIGNING ─────
  # STILL INERT, BUT NOT FOR THE REASON THIS COMMENT USED TO GIVE. It said
  # "`identity: null` above means nothing is signed"; something IS signed now.
  # Entitlements and the hardened runtime are applied at codesign time, and the
  # ad-hoc `codesign` call in lib/adhoc-sign.mjs deliberately passes NEITHER —
  # no entitlements file, and no `--options runtime`, because the hardened
  # runtime without `disable-library-validation` stops an ad-hoc bundle loading
  # its own frameworks at all. So these three keys still have no effect on what
  # ships, and gain one the day a Developer ID lands. It is here because
  # the entitlement that matters is one whose absence fails SILENTLY on the
  # first screen an existing user sees — see the long note in
  # build/entitlements.mac.plist. Deciding it after the first signed build is
  # how it gets missed.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

  # ── TCC usage descriptions — a DIFFERENT mechanism from entitlements ──────
  # A hardened, notarized app that touches ~/Documents, ~/Desktop or
  # ~/Downloads without the matching NS*UsageDescription string is KILLED by
  # TCC, not gracefully denied. A "second brain" folder plausibly lives in
  # exactly those places, and the app reads it on every ingest, chat and sync.
  # NSAppleEventsUsageDescription pairs with the apple-events entitlement: the
  # entitlement makes it POSSIBLE, this string is what the consent prompt says.
  extendInfo:
    NSAppleEventsUsageDescription: >-
      The Curator uses a macOS folder picker so you can choose where your
      knowledge base is stored.
    NSDocumentsFolderUsageDescription: >-
      The Curator reads and writes your knowledge base. Allow access if your
      knowledge folder is in Documents.
    NSDesktopFolderUsageDescription: >-
      The Curator reads and writes your knowledge base. Allow access if your
      knowledge folder is on the Desktop.
    NSDownloadsFolderUsageDescription: >-
      The Curator reads documents you ingest. Allow access if you ingest files
      from Downloads.

dmg:
  # The /Applications symlink is not decoration. It is the first mitigation
  # for App Translocation: an app run from the DMG or from ~/Downloads is
  # executed from a randomised read-only mount under /private/var/folders,
  # and `process.execPath` then points somewhere that will not exist next
  # launch — which is exactly the path written into Claude Desktop's config.
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── NOT CONFIGURED, deliberately ─────────────────────────────────────────────
# publish:        no GitHub Releases upload. The DMGs are built here and
#                 uploaded to the release separately.
# electron-updater: not installed, not wired — and it never can be for this
#                   build. THE APP IS NOT WITHOUT AUTO-UPDATE; it updates
#                   itself, through its own engine in desktop/lib/, and that is
#                   a REPLACEMENT for electron-updater rather than a stopgap.
#                   Squirrel.Mac validates every download against the RUNNING
#                   app's designated requirement, and an ad-hoc signature has
#                   no certificate and no team, so that requirement is the
#                   cdhash of one exact build — which every genuine update
#                   changes by definition. It fails 100% of the time, inside
#                   Electron's own binary where no config reaches it. Two more
#                   blockers, each sufficient alone: Squirrel installs from a
#                   ZIP while releases publish .dmg, and electron-updater reads
#                   `latest-mac.yml`, which electron-builder emits only when
#                   `publish` is set — and ours is `null`, below.
# afterSign:      no notarization hook (paid enrolment). The afterSign line at
#                 the top is the Windows exe check, a no-op on a Mac build.
# electronFuses:  NOT SET, and it must stay that way: the RunAsNode fuse has to
#                 stay ON for the MCP bridge (ELECTRON_RUN_AS_NODE=1), and on
#                 the Mac flipping any fuse after afterPack would invalidate the
#                 ad-hoc signature (lib/adhoc-sign.mjs refuses it). The win32
#                 afterSign reads the real fuse wire out of the built exe.
# linux:          out of scope.
publish: null

# ═════════════════════════════════════════════════════════════════════════════
#  WINDOWS (2026-11-20) — `npm run dist` on Windows, or CI's windows job:
#
#      node lib/fetch-mingit.mjs        # MinGit, verified against its pin
#      npx electron-builder --win --config electron-builder.yml \
#          --config.extraMetadata.version=<X.Y.Z> --publish never
#
#  Output: dist/TheCurator-<X.Y.Z>-x64-Windows-Setup.exe (and dist/win-unpacked).
#
#  Everything below is read ONLY by a --win build. A Mac build never looks at
#  `win:` or `nsis:`, so the DMGs are unchanged.
#
#  NOT SIGNED. There is no Windows certificate: nothing here names one, and no
#  such value may ever be written into this public file. Windows therefore
#  shows "Windows protected your PC" on the first install (More info → Run
#  anyway). `signAndEditExecutable: true` still lets electron-builder write the
#  icon and the version into the exe (resedit, no certificate involved). When
#  signing arrives (Azure Trusted Signing), it comes in through GitHub secrets
#  and electron-builder's own variables, never this file — and see the MinGit
#  note below first: electron-builder signs every .exe it copies, which would
#  change MinGit's files and trip the afterPack check.
# ═════════════════════════════════════════════════════════════════════════════
win:
  # Generated from images/applet.icns by build/make-win-icons.mjs (committed;
  # the offline suite re-generates it and compares every pixel).
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: true
  # Merged with the top-level extraResources (node_modules), not replacing it.
  # `from` is relative to desktop/; `to` is relative to resources\.
  extraResources:
    # MinGit, exactly as lib/fetch-mingit.mjs unpacked it after checking its
    # size and SHA-256 against the pin. src/brain/subprocess-env.js looks for
    # it at <install>\resources\git\cmd\git.exe. Its LICENSE.txt and
    # etc\package-versions.txt travel inside, untouched; the win32 afterPack
    # proves the copied folder is file-for-file what was verified.
    - from: vendor/mingit/git
      to: git
      filter:
        - '**/*'
    - from: vendor/mingit/THIRD-PARTY-NOTICES.txt
      to: THIRD-PARTY-NOTICES.txt
    # The tray icon, in colour (Windows has no template images). Placed inside
    # the app folder so main.js finds it at path.join(__dirname, 'build', …)
    # both packaged and in `electron .`.
    - from: build/tray.ico
      to: app/build/tray.ico
    - from: build/tray.png
      to: app/build/tray.png
    - from: build/tray@2x.png
      to: app/build/tray@2x.png

# The installer the owner asked for: double-click → (SmartScreen: More info →
# Run anyway) → Welcome → Install → Finish with "Run The Curator" ticked → the
# app opens. Per user, no administrator prompt, no choice of folder.
#
# Measured against app-builder-lib 26.15.3's own templates, not recalled:
#   · assisted (oneClick: false) installs to %LOCALAPPDATA%\Programs\The Curator
#     (APP_FILENAME = the product file name, because it matches [-_+0-9a-zA-Z .]);
#   · per-user writes HKCU only; the Apps & features key is
#     HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\<guid>, the guid
#     being UUID v5 of appId (lib/win-pack.mjs NSIS_GUID);
#   · both shortcuts get the AppUserModelID = appId (WinShell::SetLnkAUMI), which
#     desktop/main.js must pass to app.setAppUserModelId() on win32;
#   · the uninstaller removes $INSTDIR and the shortcuts; it deletes
#     %APPDATA%\The Curator only when deleteAppDataOnUninstall is true or it is
#     run with --delete-app-data, and it never names %LOCALAPPDATA%\TheCurator,
#     where the user's knowledge base lives (build/installer.nsh adds a guard);
#   · a silent update (/S --updated --force-run) keeps the shortcuts and starts
#     the app again (passing --updated to it).
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: The Curator
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: The Curator
  # No blockmap: nothing reads one (the app updates itself without
  # electron-updater, as on the Mac).
  differentialPackage: false
  artifactName: TheCurator-${version}-${arch}-Windows-Setup.${ext}
  # The welcome page, the per-user-only install mode (no "all users" choice,
  # so never a UAC prompt) and the uninstall guard.
  include: build/installer.nsh
