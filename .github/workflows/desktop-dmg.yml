name: Desktop DMG

# ═══════════════════════════════════════════════════════════════════════════
#  TAG-GATED. Never `main`, never a pull request, never `workflow_dispatch`.
#  Every one of those absences is load-bearing — read this block before adding
#  a trigger.
#
#  ── 1. An ordinary push must never reach here ────────────────────────────
#  macOS runners bill at 10x the Linux rate, and this workflow is the one
#  that will eventually hold Developer ID signing secrets. Neither belongs on
#  every commit. Tag-only also inherits the property `.github/workflows/
#  test.yml` relies on for its own live job: GitHub withholds secrets from
#  fork pull requests, and a fork cannot push a tag to this repository at all.
#
#  ── 2. It must not be able to join the release gate ──────────────────────
#  `scripts/release.js` gates a release on CI, and it finds the run to read
#  like this (watchCi):
#
#      gh run list --branch <branch> --limit 10 --json databaseId,headSha,…
#      runs.find((r) => r.headSha === sha)
#
#  That `find` is filtered by BRANCH and by SHA — it is NOT filtered by
#  workflow. So any second workflow producing a run on the same branch at the
#  same SHA is a coin flip for which run the gate reads, and the gate would
#  then report THIS workflow's job conclusions as if they were the test
#  suite's. That is precisely the "a gate that passes on nothing" failure
#  v3.29.0's `ci-not-reachable` check exists to prevent, arriving through a
#  different door.
#
#  Two absences keep this workflow out of that query:
#
#    · no `branches:` and no bare `push:` — a tag push produces a run whose
#      `head_branch` is the TAG name, not `main`, so `--branch main` and
#      `--branch release/vX.Y.Z` both exclude it.
#
#    · no `workflow_dispatch` — and this one is the non-obvious half. A
#      manual dispatch runs against a BRANCH, so its run WOULD carry
#      `head_branch: main` and could collide on SHA with the very run
#      `release.js --watch-main` is waiting for. Convenience is not worth
#      re-opening that. To exercise this workflow, push a throwaway tag and
#      delete it afterwards.
#
#  `scripts/test-desktop-packaging.js` asserts all of the above against this
#  file. If you add a trigger, that suite goes red and it is right to.
#
#  THE DURABLE FIX HAS SINCE LANDED IN release.js, and it did not make the
#  absences above redundant. `watchCi` now passes `--workflow`, so the gate
#  reads test.yml's run by name and no second workflow can be mistaken for it.
#  Keep the two triggers absent anyway: that pin protects the gate, while these
#  absences are also what keep a macOS runner off every commit and out of reach
#  of a fork.
#
#  ── 3. IT NOW PUBLISHES THE RELEASE, AND THAT ADDS NO RUN ────────────────
#  Added in v3.38.0. Until then this workflow uploaded the two DMGs as a
#  14-day workflow ARTIFACT and stopped, and publishing them — renamed — as a
#  GitHub Release was a manual step nobody had written down. Six releases went
#  out with a tag and no release, during which the in-app updater, which
#  resolves "the newest release carrying an installer" from the Releases API,
#  told every installed copy it was up to date while it ran the previous
#  version. A wrong reassurance is worse than an error.
#
#  Publishing does NOT re-open the hazard argued above. `gh release create`
#  produces no workflow run of its own: GitHub does not start a workflow from
#  an event raised with the automatic `GITHUB_TOKEN`, and this repository has
#  no `on: release` workflow for it to start even if it did. Nothing here
#  pushes a commit, a branch or a tag either — `--verify-tag` makes `gh` abort
#  rather than create the tag it is publishing against. So the set of runs a
#  release SHA can produce is unchanged, and `watchCi`'s `--workflow` pin
#  keeps holding regardless.
#
#  ── 4. WINDOWS (2026-11-20), AND THE ONLY SAFE WAY TO REHEARSE ────────────
#  Three more jobs build, prove and publish the Windows installer:
#
#    windows          build on windows-latest, check what was built, install,
#                     launch, uninstall silently, the data-folder guard
#    windows-update   install THIS build, update it to a rebuilt N+1 served
#                     from a local fixture, prove the app reopens on N+1
#    publish-windows  attach the installer AND the source of every copyleft part
#                     of the MinGit inside it to the SAME release, AFTER the Mac job
#
#  The Mac job never needs a Windows job, so a Windows failure can never stop
#  or delay the Mac release. publish-windows needs `dmg` only to run AFTER it
#  (`always()`, so a failed or skipped Mac job does not block Windows either):
#  the two `gh release create` calls therefore never race, and whichever runs
#  second takes the "already exists, upload --clobber" arm.
#
#  WHICH TAG IS A RELEASE. The project ships plain X.Y.Z only (release.js,
#  "Plain semver, no pre-release suffixes"), so the gate below calls a tag a
#  RELEASE only when it is exactly vX.Y.Z. Any other v* tag is a REHEARSAL:
#  the Mac job is skipped (no 10x runner, no publish), the Windows build,
#  install and update checks run with the version in package.json, and NOTHING
#  is published, so no release exists for any updater to see. That is the way
#  to exercise this file: push a tag such as `v3.99.3-wintest.1`, watch, then
#  delete the tag. (Before this gate, a v*-tag of any shape built and
#  PUBLISHED a Mac release marked latest.)
# ═══════════════════════════════════════════════════════════════════════════
on:
  push:
    tags:
      - 'v*'

# The DEFAULT token for this workflow is read-only, and the `gate` job below
# inherits it. Exactly two jobs widen it — `dmg` and `publish-windows`, to
# `contents: write`, at the JOB level, because that is the only scope GitHub offers for "may create a
# release" and a job-level block REPLACES this one rather than adding to it.
# Declaring it here instead would hand a write token to the cheap Linux gate
# and to every job anyone adds later, none of which has any reason to hold one.
permissions:
  contents: read

concurrency:
  group: desktop-dmg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Cheap gate, on Linux, so a macOS runner is only started when there is
  #    actually something to build.
  #
  #    IT IS NOW OPEN, AND THAT IS THE COST TO KNOW ABOUT. This job was written
  #    while `desktop/` was an uninstalled scaffold, when the lockfile it keys
  #    on did not exist and the build job therefore always skipped. That is no
  #    longer the shape of the tree: `desktop/package-lock.json` is COMMITTED,
  #    so `buildable` resolves to true and EVERY `v*` tag starts a real macOS
  #    runner, billed at 10x the Linux rate, for as long as the tag push takes
  #    to build a DMG. Intended — the build works and its artifacts have been
  #    verified — but it is a real per-release charge rather than the ~40s of
  #    Linux the skip used to cost.
  #
  #    The skip arm below is kept, not dead: it is what stops a tag pushed from
  #    a tree where the lockfile was removed from failing on a macOS runner.
  #    It is deliberately a PASS rather than a failure — a permanently red
  #    workflow on every tag trains people to ignore red.
  gate:
    name: Desktop build gate
    runs-on: ubuntu-latest
    outputs:
      buildable: ${{ steps.check.outputs.buildable }}
      release: ${{ steps.kind.outputs.release }}
      version: ${{ steps.kind.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # RELEASE or REHEARSAL (header, section 4). `release` is true only for a
      # tag that is exactly vX.Y.Z; `version` is that X.Y.Z, or, for a
      # rehearsal, package.json's version (the Windows build refuses a version
      # that differs from package.json, desktop/lib/win-pack.mjs).
      # scripts/test-release-publish.js EXECUTES this script with fake tags.
      - id: kind
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          root_version="$(node -p "require('./package.json').version")"
          release_re='^v[0-9]+[.][0-9]+[.][0-9]+$'
          if [[ "$tag" =~ $release_re ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "Release tag $tag: build and publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=${root_version}" >> "$GITHUB_OUTPUT"
            {
              echo "### Rehearsal tag \`$tag\`: nothing will be published"
              echo
              echo "Not exactly vX.Y.Z, so the Mac job and both publish steps are skipped."
              echo "The Windows jobs build and check version ${root_version} (package.json)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: check
        run: |
          if [ -f desktop/package-lock.json ]; then
            echo "buildable=true" >> "$GITHUB_OUTPUT"
            echo "desktop/package-lock.json present — proceeding to build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "buildable=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Desktop build skipped"
              echo
              echo "\`desktop/package-lock.json\` does not exist, so \`desktop/\` has never had"
              echo "\`npm install\` run in it. It is a committed scaffold — see \`desktop/README.md\`."
              echo
              echo "This is expected and is not a failure."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  dmg:
    name: Build ad-hoc signed DMG (macOS)
    needs: gate
    if: needs.gate.outputs.buildable == 'true' && needs.gate.outputs.release == 'true'
    runs-on: macos-latest
    # NARROW ON PURPOSE. `contents: write` is what `gh release create` needs and
    # it is the smallest scope that can do it — GitHub has no "releases only"
    # permission. It is declared HERE rather than at the top of the file so the
    # Linux gate job keeps the read-only default, and so a future job does not
    # inherit a write token by being added below this one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The app's OWN runtime dependencies, production only. electron-builder.yml
      # copies this tree into the packaged app rather than installing a second
      # one under desktop/, because the runtime deps belong to the app, not to
      # the shell. `--omit=dev` is belt-and-braces: the root manifest has no
      # devDependencies, and scripts/test-desktop-packaging.js asserts that.
      - name: Install app runtime dependencies (repo root)
        run: npm ci --omit=dev

      # Electron + electron-builder, isolated in desktop/. This is the whole
      # reason for the second manifest: nothing here can ever reach the root
      # package.json that every user's auto-updater runs `npm install` against.
      - name: Install Electron toolchain (desktop/)
        working-directory: desktop
        run: npm ci

      # ── NO CERTIFICATE, and forced to stay that way ───────────────────────
      # "Unsigned" is the wrong word for what comes out of here, and the
      # distinction matters. The bundle IS signed — ad hoc, by the `afterPack`
      # hook in desktop/lib/adhoc-sign.mjs, which also REFUSES the build if a
      # real certificate ever appears on it. What it carries is no Developer ID
      # and no notarization, which is what a user sees as the Gatekeeper
      # detour, and what makes Squirrel-based auto-update impossible (the app
      # ships its own updater instead — see desktop/lib/update-engine.js).
      #
      # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder finding an
      # identity in a runner keychain and quietly producing a certificate-
      # signed artifact nobody configured. It pairs with `mac.identity: null`
      # in electron-builder.yml — belt and braces, because the failure mode is
      # silent.
      #
      # NO SIGNING OR NOTARIZATION CREDENTIALS APPEAR IN THIS FILE, and none
      # may ever be written here as a literal — this repository is PUBLIC.
      # When signing lands it arrives as GitHub Actions secrets consumed by
      # electron-builder's own environment variables, referenced by NAME only:
      #
      #     CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
      #     CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #
      # Those secrets do not exist yet, and adding them is a decision for the
      # packaging release, not a step someone copies out of a comment.
      #
      # The version comes from the git tag: desktop/package.json is pinned at
      # 0.0.0 on purpose so no one can ship a DMG whose version was hand-typed
      # and drifted from the release it claims to be.
      - name: Build DMG (ad-hoc signed, no Developer ID)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npx --no-install electron-builder \
            --mac \
            --config electron-builder.yml \
            --config.extraMetadata.version="$VERSION" \
            --publish never

      # ── 1. THE RENAME, AND THE CHECK THAT IT WORKED ──────────────────────
      #
      # electron-builder writes `The Curator-3.37.0-arm64.dmg` and
      # `The Curator-3.37.0.dmg` — note that the x64 build carries NO arch in
      # its name at all, which is electron-builder's documented default. The
      # in-app updater picks its download with `archFromAssetName()` in
      # `desktop/lib/update-plan.js`, which splits the stem on `-` and looks
      # for a whole token `arm64` or `x64`. Run against those raw names it
      # returns `arm64` and **null**, so a release published unrenamed offers
      # nothing at all to an Intel Mac, silently.
      #
      # `scripts/publish-dmg-assets.js` renames them and then feeds the final
      # names through the REAL `archFromAssetName` — the imported function, not
      # a regex transcribed into this file — asserting one resolves to `arm64`
      # and the other to `x64`. It re-reads the directory after renaming, so it
      # verifies the files that exist rather than the plan it made. A refusal
      # exits non-zero and this job fails before anything is published.
      #
      # It also writes the two final paths to $GITHUB_OUTPUT, so the steps
      # below address them by name. Globbing would put "which file is which
      # architecture" back into shell ordering, which is the exact thing being
      # verified.
      - name: Name the DMGs the way the updater matches them
        id: names
        run: node scripts/publish-dmg-assets.js --dir desktop/dist --version "${GITHUB_REF_NAME#v}"

      # ── 2. AND THE NAME IS ONLY A CLAIM ──────────────────────────────────
      #
      # The step above proves the FILENAMES parse correctly. It opens no disk
      # image, so a `.dmg` named `x64-Intel` holding an arm64 binary would sail
      # through it — and that mistake ships an Intel user a build their Mac
      # cannot execute, discovered only on their machine. So mount each image
      # and ask the binary itself.
      #
      # `lipo -archs` spells x64 as `x86_64`; the mapping is asserted in
      # scripts/test-release-publish.js against LIPO_ARCH so the two spellings
      # cannot drift. Detach happens BEFORE the comparison so a mismatch does
      # not leave a mounted image behind.
      - name: Verify each DMG really contains the architecture its name claims
        run: |
          set -euo pipefail
          check() {
            want="$1"; dmg="$2"
            mnt="$(mktemp -d)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
            got="$(lipo -archs "$mnt/The Curator.app/Contents/MacOS/The Curator")"
            hdiutil detach "$mnt" >/dev/null
            echo "$(basename "$dmg"): name claims $want, lipo reports '$got'"
            if [ "$got" != "$want" ]; then
              echo "::error::$(basename "$dmg") contains '$got' but is named for '$want'"
              exit 1
            fi
          }
          check arm64  "${{ steps.names.outputs.arm64 }}"
          check x86_64 "${{ steps.names.outputs.x64 }}"

      # KEPT. The artifact is a 14-day fallback if the publish below fails, and
      # it costs nothing. It now carries the published names, because it runs
      # after the rename.
      - uses: actions/upload-artifact@v4
        with:
          name: the-curator-dmg-${{ github.ref_name }}
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      # ── 3. PUBLISH ───────────────────────────────────────────────────────
      #
      # `--verify-tag` is not decoration: without it `gh release create` will
      # CREATE the tag it cannot find. This workflow only ever runs on a tag
      # that already exists, and `scripts/release.js` is the only thing allowed
      # to make one, so a run that somehow reached here without its tag must
      # fail rather than invent it.
      #
      # The re-run arm exists because this job is not the only thing that can
      # fail — a red `lipo` check, a runner timeout, a re-run from the Actions
      # UI. `gh release create` errors on an existing release, so a second
      # attempt would fail for the wrong reason and leave the release without
      # its installers. Uploading with `--clobber` replaces the assets of the
      # release that is already there.
      #
      # `--latest` is what `pickInstallableRelease()`'s callers see reflected on
      # the Releases page. It does not drive the updater — that reads the whole
      # release list and picks the newest one carrying an installer — but a
      # human landing on /releases/latest should not be sent to an older build.
      - name: Publish the GitHub Release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARM64_DMG: ${{ steps.names.outputs.arm64 }}
          X64_DMG: ${{ steps.names.outputs.x64 }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — replacing its installers."
            gh release upload "$TAG" "$ARM64_DMG" "$X64_DMG" --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" "$ARM64_DMG" "$X64_DMG" \
              --title "The Curator $TAG" \
              --generate-notes \
              --verify-tag \
              --latest
          fi
          {
            echo "### Published $TAG"
            echo
            echo "- \`$(basename "$ARM64_DMG")\`"
            echo "- \`$(basename "$X64_DMG")\`"
            echo
            echo "The in-app updater reads these from the Releases API. Until this step ran,"
            echo "every installed copy reported \"up to date\" while running the previous version."
          } >> "$GITHUB_STEP_SUMMARY"

  # ═════════════════════════════════════════════════════════════════════════
  #  WINDOWS (header, section 4). Nothing above this line depends on anything
  #  below it.
  # ═════════════════════════════════════════════════════════════════════════
  #
  # Builds the installer with the commands desktop/electron-builder.yml names,
  # then proves on a real Windows what no offline suite can (the list is
  # scripts/test-desktop-win-build.js section 11 and the packages' CI notes):
  # scripts/ci-win-app.mjs says exactly what each step checks. The default
  # read-only token: this job publishes nothing.
  windows:
    name: Build and check the Windows installer
    needs: gate
    if: needs.gate.outputs.buildable == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install app runtime dependencies (repo root)
        run: npm ci --omit=dev

      - name: Install Electron toolchain (desktop/)
        working-directory: desktop
        run: npm ci

      # The cached archive is re-checked against the pin (size, then SHA-256)
      # by fetch-mingit.mjs exactly as a fresh download is; the cache only
      # saves the 40 MB. Key and path are the pin's own values
      # (scripts/test-release-publish.js keeps them equal to MINGIT).
      - name: Reuse the MinGit download
        uses: actions/cache@v4
        with:
          path: desktop/vendor/MinGit-2.56.1-64-bit.zip
          key: mingit-4a92850b6e917da4fd010669b614b55dccf5b0ec333a534cc4be4700dfefdafd

      - name: Fetch MinGit 2.56.1 (size and SHA-256 checked before anything is unpacked)
        working-directory: desktop
        run: node lib/fetch-mingit.mjs

      # NOT SIGNED: no Windows certificate exists and none may be written into
      # this public file. CSC_IDENTITY_AUTO_DISCOVERY=false is belt and braces,
      # as on the Mac. The version comes from the gate (the tag, or
      # package.json on a rehearsal); afterPack refuses a version that differs
      # from package.json, and afterSign reads it back out of the exe.
      - name: Build the Windows installer (not signed)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win --config electron-builder.yml "--config.extraMetadata.version=$env:VERSION" --publish never

      - name: Check the installer's name against the updater's own matchers
        id: names
        run: node scripts/publish-win-assets.js --dir desktop/dist --version $env:VERSION --check-consumers

      - name: Check what was built (versions, marker, git, notices, icons, RunAsNode, a launch)
        run: node scripts/ci-win-app.mjs check-build --unpacked desktop/dist/win-unpacked --setup "${{ steps.names.outputs.setup }}" --version $env:VERSION

      - name: Install, launch, uninstall silently, and the data-folder guard
        timeout-minutes: 25
        run: node scripts/ci-win-app.mjs install-smoke --setup "${{ steps.names.outputs.setup }}" --version $env:VERSION

      # v4.1.0: the tray popover in the INSTALLED app (install, launch in tray
      # mode with isolated data and CURATOR_TEST_TRAY_POPOVER_SELFTEST=1, which
      # the app honours only alongside CURATOR_TEST_USER_DATA_DIR; it shows the
      # popover, checks it and logs `tray-popover-selftest: pass`, which the
      # runner greps from curator.log; then uninstall).
      - name: The tray popover self-test (shown, inside the work area, painted, no CSP refusal, Esc hides it)
        timeout-minutes: 15
        run: node scripts/ci-win-app.mjs popover-selftest --setup "${{ steps.names.outputs.setup }}" --version $env:VERSION

      # The notices travel with the installer so publish-windows checks the
      # file this build SHIPPED names the source it attaches.
      #
      # Uploaded even when a check above FAILED (as long as the build made a
      # setup program the name check accepted), so the installer of a red run
      # can still be downloaded and tried by hand. That never ships it:
      # windows-update and publish-windows both need this job to SUCCEED, so a
      # build that failed a check is neither rehearsed nor published.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.names.outputs.setup != '' }}
        with:
          name: the-curator-windows-${{ github.ref_name }}
          path: |
            desktop/dist/TheCurator-*-x64-Windows-Setup.exe
            desktop/dist/win-unpacked/resources/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 14

      - name: The update and app logs, when something failed
        if: failure()
        shell: pwsh
        run: |
          foreach ($d in @("$env:LOCALAPPDATA\TheCurator\logs", "$env:TEMP")) {
            Get-ChildItem -LiteralPath $d -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content -LiteralPath $_.FullName -Tail 60 }
          }

  # F's update test, on a clean runner: install THIS build (N, from the job
  # above), rebuild the same tree stamped N+1 (package.json on this runner
  # only), serve N+1 from a local fixture through the engine's injected fetch
  # (no production seam: scripts/ci-win-app.mjs "THE SEAM"), and drive the
  # installed N's own updater, including the AI-app-connection refusal.
  windows-update:
    name: Rehearse the Windows in-app update
    needs:
      - gate
      - windows
    if: needs.gate.outputs.buildable == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install app runtime dependencies (repo root)
        run: npm ci --omit=dev

      - name: Install Electron toolchain (desktop/)
        working-directory: desktop
        run: npm ci

      - name: Reuse the MinGit download
        uses: actions/cache@v4
        with:
          path: desktop/vendor/MinGit-2.56.1-64-bit.zip
          key: mingit-4a92850b6e917da4fd010669b614b55dccf5b0ec333a534cc4be4700dfefdafd

      - name: Fetch MinGit 2.56.1 (size and SHA-256 checked before anything is unpacked)
        working-directory: desktop
        run: node lib/fetch-mingit.mjs

      - name: Download this build (version N)
        uses: actions/download-artifact@v4
        with:
          name: the-curator-windows-${{ github.ref_name }}
          path: ${{ runner.temp }}/release-n

      - name: Stamp this runner's tree as N+1 (never committed)
        id: next
        run: |
          $next = node scripts/ci-win-app.mjs next-version --version $env:VERSION
          if ($LASTEXITCODE -ne 0 -or -not $next) { throw "no next version for $env:VERSION" }
          node scripts/ci-win-app.mjs stamp-version --version $next
          if ($LASTEXITCODE -ne 0) { throw 'stamp-version failed' }
          "next=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build N+1 (not signed)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --no-install electron-builder --win --config electron-builder.yml "--config.extraMetadata.version=${{ steps.next.outputs.next }}" --publish never

      - name: Update N to N+1 through the installed app's own updater
        timeout-minutes: 30
        run: node scripts/ci-win-app.mjs rehearse-update --from "${{ runner.temp }}\release-n\TheCurator-$($env:VERSION)-x64-Windows-Setup.exe" --from-version $env:VERSION --to "desktop\dist\TheCurator-${{ steps.next.outputs.next }}-x64-Windows-Setup.exe" --to-version ${{ steps.next.outputs.next }}

      - name: The update and app logs, when something failed
        if: failure()
        shell: pwsh
        run: |
          # The helper's own files WHOLE (wintest.4 printed only the last 80
          # lines of install-update.ps1, hiding its head), then other logs' tails.
          Get-ChildItem -LiteralPath "$env:LOCALAPPDATA\TheCurator\updates" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.FullName) ($($_.Length) bytes)"; if ($_.Extension -in '.ps1', '.json', '.started', '.txt') { Get-Content -LiteralPath $_.FullName } }
          Get-ChildItem -LiteralPath "$env:LOCALAPPDATA\TheCurator\logs" -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'update-install.log' } | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content -LiteralPath $_.FullName }
          foreach ($d in @("$env:LOCALAPPDATA\TheCurator\logs", "$env:TEMP")) {
            Get-ChildItem -LiteralPath $d -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.log', '.json' -and $_.Name -ne 'update-install.log' } | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content -LiteralPath $_.FullName -Tail 80 }
          }

  # Attach the installer and the MinGit sources to the SAME release the Mac job
  # published (or create it, when the Mac job failed). On a release tag only,
  # and only when both Windows jobs passed. `always()` makes it wait for the
  # Mac job without depending on its result; the Mac job does not wait for
  # this one.
  publish-windows:
    name: Publish the Windows installer
    needs:
      - gate
      - dmg
      - windows
      - windows-update
    if: always() && needs.gate.outputs.release == 'true' && needs.windows.result == 'success' && needs.windows-update.result == 'success'
    runs-on: ubuntu-latest
    # The same narrow scope as `dmg`, for the same reason, at the job level.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download the Windows build
        uses: actions/download-artifact@v4
        with:
          name: the-curator-windows-${{ github.ref_name }}
          path: win-release

      - name: Check the installer's name again, on what is about to be published
        id: names
        run: node scripts/publish-win-assets.js --dir win-release --version "${{ needs.gate.outputs.version }}"

      # MinGit contains GPL, LGPL and MPL parts. The exact corresponding source
      # of EVERY one of them goes on the same release (owner's decision,
      # 2026-11-20): GitHub's archive of the git-for-windows tag plus one
      # makepkg source package per copyleft component, as
      # desktop/lib/fetch-mingit.mjs RELEASE_SOURCE_ASSETS lists them. Each is
      # downloaded and held to its pin (exact size; SHA-256 where the host
      # publishes one; its tree) BEFORE anything is published, and the notices
      # file the build shipped must name every one. One failure: nothing at all
      # is published.
      - name: Fetch and verify the source of every copyleft MinGit component
        id: sources
        run: node scripts/publish-win-assets.js --sources --out "$RUNNER_TEMP/gpl-source" --notices win-release/win-unpacked/resources/THIRD-PARTY-NOTICES.txt

      - name: Attach the Windows installer and the source files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SETUP: ${{ steps.names.outputs.setup }}
          SOURCES_LIST: ${{ steps.sources.outputs.sources_list }}
        run: |
          set -euo pipefail
          mapfile -t SOURCES < "$SOURCES_LIST"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists (the Mac job made it): adding the Windows files."
            gh release upload "$TAG" "$SETUP" "${SOURCES[@]}" --clobber
          else
            echo "Release $TAG does not exist (the Mac job failed or was skipped): creating it."
            gh release create "$TAG" "$SETUP" "${SOURCES[@]}" \
              --title "The Curator $TAG" \
              --generate-notes \
              --verify-tag \
              --latest
          fi

      # By EXACT name: the setup and every source file, each with the size of
      # the file verified above (and GitHub's digest where it records one). A
      # missing one fails this job. GitHub's API is eventually consistent, so
      # a miss is re-read a few times before it counts.
      - name: Check every file is on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SETUP: ${{ steps.names.outputs.setup }}
          SOURCES_LIST: ${{ steps.sources.outputs.sources_list }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5 6; do
            gh release view "$TAG" --json assets > "$RUNNER_TEMP/release-assets.json" &&
              node scripts/publish-win-assets.js --check-release "$RUNNER_TEMP/release-assets.json" --setup "$SETUP" --sources-list "$SOURCES_LIST" &&
              exit 0
            echo "Attempt $attempt: the release does not show every file yet."
            sleep 10
          done
          exit 1

      - name: Summary
        env:
          SETUP: ${{ steps.names.outputs.setup }}
          SOURCES_LIST: ${{ steps.sources.outputs.sources_list }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Windows files on $TAG"
            echo
            echo "- \`$(basename "$SETUP")\`"
            echo "- $(wc -l < "$SOURCES_LIST" | tr -d ' ') source files (GPL/LGPL/MPL parts of the bundled MinGit):"
            while IFS= read -r f; do echo "  - \`$(basename "$f")\`"; done < "$SOURCES_LIST"
          } >> "$GITHUB_STEP_SUMMARY"
