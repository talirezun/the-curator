name: Tests

# When this runs:
#   - push to any branch        → offline tests (free); live tests only on main
#   - pull request (incl forks) → offline tests only (NO secrets exposed to forks)
#   - manual "Run workflow"      → offline + live
#
# Docs-only pushes are skipped (paths-ignore below): a push whose changed files
# are ALL markdown / docs does NOT trigger the workflow, so we don't spend paid
# Gemini/Anthropic credits (or Actions minutes) on a documentation-only commit.
# A push that touches ANY non-doc file still runs normally. Pull requests are NOT
# path-filtered, so a docs PR still gets the free offline check + a green tick.
#
# ── DO NOT ADD A `branches:` FILTER TO THE PUSH TRIGGER ─────────────────────
# The absence of one is LOAD-BEARING. `scripts/release.js` releases through a
# gate — it pushes `release/vX.Y.Z`, waits for THAT branch's run, and fast-
# forwards `main` onto it only when the run is green. A bare `push:` fires on
# every branch, which is what makes the release branch get a run at all.
#
# Restricting this to `main` would not break loudly: the release branch would
# simply get NO run, and a gate that waits for a run which never starts is
# worse than having no gate, because it looks like one. `release.js` therefore
# REFUSES to release (`ci-not-reachable`) if it finds a `branches:` or
# `branches-ignore:` key under `push:` here, and `test-release-preconditions.js`
# asserts the same thing against this file. If you genuinely need a filter,
# make it include `release/v*` and update both.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

jobs:
  # ── Offline tests: free, no network, no API key. The required gate. ─────────
  offline:
    name: Offline tests (free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # FULL history, not the default shallow clone. `test-build-model.js`
          # proves the model resolver is byte-identical to its pre-release
          # baseline by extracting that baseline with `git show <sha>:file` and
          # running both side by side over 20 config shapes x 11 call shapes.
          # A depth-1 checkout has ONE commit, so the blob is unreachable and
          # the suite fails on CI while passing locally — which is what happened
          # on 2026-08-29. The suite is right to fail loudly rather than skip:
          # a guard that quietly opts out on CI is the one place it matters most.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # ── Windows: the one-click Claude Desktop installer on a REAL Windows disk ───
  # v3.86.0. The installer writes Claude Desktop's config on Windows, a platform
  # the maintainer cannot run locally. `test-mcp-install-windows.js` runs every
  # scenario twice: on an in-memory Windows filesystem (also run by `offline`
  # on Linux and by `npm test` on a Mac) AND on the real disk — which only HERE
  # is NTFS with real `C:\…` paths, real MoveFileEx rename-over, the real
  # read-only attribute and real CRLF/BOM bytes. Only %LOCALAPPDATA%/%APPDATA%
  # are simulated (inside a scratch home); the suite fingerprints the runner's
  # real Claude Desktop candidates before and after.
  #
  # Only this suite runs here: the macOS install suites assert POSIX modes,
  # symlinks and `~/Library` paths, which are not Windows facts.
  #
  # THIS JOB GATES A RELEASE. `scripts/release.js` reads per-JOB conclusions and
  # treats every job not named in its ADVISORY_JOBS as part of the gate, and
  # this job runs on `release/v*` branches because the push trigger is
  # unfiltered. A red Windows run therefore leaves `main` untouched (CI_RED). To
  # make it report-only instead, put `continue-on-error: true` on the test STEP
  # (not the job) — no release.js change is needed either way.
  #
  # autocrlf is turned off BEFORE checkout so the repo's files arrive as
  # committed (the suite writes its own fixtures, but nothing should depend on
  # the runner's git defaults).
  windows:
    name: Windows installer tests
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-mcp-install-windows.js

  # ── Windows: the one-line installer, end to end, on a real Windows PC ───────
  # v3.87.0. `install.ps1` is what non-technical Windows users paste into
  # PowerShell, and the maintainer has no Windows PC to try it on, so THIS is
  # its proof. It installs for real (private Node.js + MinGit downloaded and
  # SHA-256 checked, the clone, npm ci, the shortcuts), starts and stops the
  # app through the two desktop-icon scripts, and re-runs the installer as a
  # repair. Both PowerShells are exercised: Windows PowerShell 5.1 (what every
  # Windows 10/11 PC has, and what the shortcuts run) and PowerShell 7.
  #
  # The install goes into a folder whose name has a SPACE and a NON-ASCII
  # letter, and %LOCALAPPDATA% (the private runtime and the logs) is pointed at
  # one too, because a user name like "Ziga Novak" (with a caron) is the most
  # likely way a quoted-path bug reaches a real user.
  #
  # Where the code comes from: on a push to a branch, the installer clones THAT
  # branch from GitHub (the same route a user's install takes). A pull request
  # (incl. forks) and a tag have no pushed branch to clone, so they clone the
  # checked-out commit from the runner's workspace via -RepoUrl instead.
  #
  # Message boxes are suppressed (CURATOR_WIN_NONINTERACTIVE=1) and the
  # browser is not opened; everything else is the real code path.
  #
  # THIS JOB GATES A RELEASE, exactly like `windows` above: release.js treats
  # every job not named in ADVISORY_JOBS as part of the gate, and it has no
  # `if:` (a skipped job is reported, not gated). Keep it that way.
  windows-install:
    name: Windows one-line install
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CURATOR_WIN_NONINTERACTIVE: '1'
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5

      - name: Parse the four scripts (Windows PowerShell 5.1 and PowerShell 7)
        shell: pwsh
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'parse-check.ps1'
          Set-Content -LiteralPath $check -Encoding ascii -Value @'
          param([string]$FileList)
          $bad = 0
          $files = $FileList.Split('|')
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) { Write-Host ("::error file=" + $f + ",line=" + $e.Extent.StartLineNumber + "::" + $e.Message); $bad++ }
          }
          Write-Host ("PowerShell " + $PSVersionTable.PSVersion + ": " + $files.Count + " files, " + $bad + " parse errors")
          if ($bad) { exit 1 }
          '@
          $files = @('install.ps1', 'scripts\windows\start-curator.ps1', 'scripts\windows\stop-curator.ps1', 'scripts\windows\curator-common.ps1') | ForEach-Object { (Resolve-Path $_).Path }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $check -FileList ($files -join '|')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & pwsh -NoProfile -File $check -FileList ($files -join '|')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Nothing in them may be non-ASCII (Windows PowerShell 5.1 reads a
          # BOM-less script in the ANSI code page).
          foreach ($f in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($f)
            foreach ($b in $bytes) { if ($b -gt 127) { Write-Host "::error file=$f::non-ASCII byte"; exit 1 } }
          }

      - name: Choose the install folders (a space and a non-ASCII letter)
        shell: powershell
        run: |
          $z = [string][char]0x017D
          $root = Join-Path $env:RUNNER_TEMP ('Curator User ' + $z + 'iga')
          $dir = Join-Path $root 'the curator %TEMP% x'
          $lad = Join-Path $root 'AppData Local'
          [void][System.IO.Directory]::CreateDirectory($lad)
          if ('${{ github.event_name }}' -ne 'pull_request' -and '${{ github.ref_type }}' -eq 'branch') {
            $branch = '${{ github.ref_name }}'
            $repo = ''
          } else {
            git -C $env:GITHUB_WORKSPACE branch -f ci-install HEAD
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $branch = 'ci-install'
            $repo = $env:GITHUB_WORKSPACE
          }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $lines = "CI_CURATOR_DIR=$dir`nLOCALAPPDATA=$lad`nCI_CURATOR_BRANCH=$branch`nCI_CURATOR_REPO=$repo`n"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, $lines, $utf8)
          Write-Host "install folder: $dir"
          Write-Host "LOCALAPPDATA:   $lad"
          Write-Host "branch: $branch   repo: $(if ($repo) { $repo } else { 'GitHub' })"

      - name: First install (Windows PowerShell 5.1, the test-a-branch form, -NoStart)
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = $env:CI_CURATOR_DIR
          & ([scriptblock]::Create((Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'install.ps1')))) -Branch $env:CI_CURATOR_BRANCH -NoStart -InstallDir $dir -RepoUrl $env:CI_CURATOR_REPO
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 reported failure ($LASTEXITCODE)" }

          $rt = Join-Path $env:LOCALAPPDATA 'TheCurator\runtime'
          $node = Join-Path $rt 'node\node.exe'
          $git = Join-Path $rt 'git\cmd\git.exe'
          foreach ($p in @($node, $git, (Join-Path $dir 'node_modules\express\package.json'), (Join-Path $dir '.env'), (Join-Path $dir 'src\server.js'))) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "missing after install: $p" }
          }
          Write-Host ("private node: " + (& $node --version) + "   private git: " + (& $git --version))
          $head = (& $git -C $dir rev-parse HEAD)
          Write-Host "checkout HEAD: $head"
          if ('${{ github.event_name }}' -ne 'pull_request' -and $head -ne '${{ github.sha }}') {
            Write-Host "::warning::the cloned branch head ($head) is not this run's commit (${{ github.sha }}); a newer push probably landed"
          }

          # Both shortcuts, in both places, with the right target, arguments and icon.
          $sh = New-Object -ComObject WScript.Shell
          $places = @([Environment]::GetFolderPath('Desktop'), (Join-Path ([Environment]::GetFolderPath('Programs')) 'The Curator'))
          $pairs = @(@('The Curator.lnk', 'start-curator.ps1', 'curator-start.ico'), @('Stop The Curator.lnk', 'stop-curator.ps1', 'curator-stop.ico'))
          foreach ($place in $places) {
            foreach ($pair in $pairs) {
              $lnkPath = Join-Path $place $pair[0]
              if (-not (Test-Path -LiteralPath $lnkPath -PathType Leaf)) { throw "missing shortcut: $lnkPath" }
              $l = $sh.CreateShortcut($lnkPath)
              $script = Join-Path $dir ('scripts\windows\' + $pair[1])
              $ico = Join-Path $dir ('scripts\windows\assets\' + $pair[2])
              if ($l.TargetPath -notlike '*\System32\WindowsPowerShell\v1.0\powershell.exe') { throw "$lnkPath target: $($l.TargetPath)" }
              if (-not $l.Arguments.Contains('-File "' + $script + '"')) { throw "$lnkPath arguments: $($l.Arguments)" }
              if (-not $l.Arguments.Contains('-ExecutionPolicy Bypass') -or -not $l.Arguments.Contains('-WindowStyle Hidden')) { throw "$lnkPath arguments: $($l.Arguments)" }
              if ($l.WorkingDirectory -ne $dir) { throw "$lnkPath working folder: $($l.WorkingDirectory)" }
              if (-not (Test-Path -LiteralPath $ico -PathType Leaf)) { throw "icon file missing: $ico" }
              if ($l.IconLocation -ne ($ico + ',0')) { throw "$lnkPath icon: $($l.IconLocation) (expected $ico,0)" }
              Write-Host "ok: $lnkPath"
            }
          }

      # v3.88.1: the bridge must start the way Claude Desktop starts it — the
      # private node.exe, the ABSOLUTE server.js, a foreign working folder and
      # only the environment the MCP SDK's stdio client passes on Windows — and
      # answer `initialize` and `tools/list`. (2026-11-01: an owner's Claude
      # Desktop said "My Curator could not start"; the check that settled it
      # ran this exact launch on windows-latest, before and after an in-app
      # update.)
      - name: MCP bridge starts as Claude Desktop starts it
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = $env:CI_CURATOR_DIR
          $node = Join-Path $env:LOCALAPPDATA 'TheCurator\runtime\node\node.exe'
          $server = Join-Path $dir 'mcp\server.js'
          $domains = Join-Path $env:RUNNER_TEMP 'mcp-start-domains'
          [void][System.IO.Directory]::CreateDirectory($domains)
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $node
          $psi.Arguments = '"' + $server + '" --domains-path "' + $domains + '"'
          $psi.WorkingDirectory = (Join-Path $env:SystemRoot 'System32')
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          # The MCP SDK's DEFAULT_INHERITED_ENV_VARS on win32, nothing else.
          $keep = @('APPDATA', 'HOMEDRIVE', 'HOMEPATH', 'LOCALAPPDATA', 'PATH', 'PROCESSOR_ARCHITECTURE', 'SYSTEMDRIVE', 'SYSTEMROOT', 'TEMP', 'USERNAME', 'USERPROFILE', 'PROGRAMFILES')
          $saved = @{}
          foreach ($k in $keep) { $saved[$k] = [Environment]::GetEnvironmentVariable($k) }
          $psi.EnvironmentVariables.Clear()
          foreach ($k in $keep) { if ($saved[$k]) { $psi.EnvironmentVariables[$k] = $saved[$k] } }
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $psi.StandardOutputEncoding = $utf8
          $psi.StandardErrorEncoding = $utf8
          $p = [System.Diagnostics.Process]::Start($psi)
          $outTask = $p.StandardOutput.ReadToEndAsync()
          $errTask = $p.StandardError.ReadToEndAsync()
          # PowerShell 7 and raw UTF-8 bytes on the base stream: under Windows
          # PowerShell 5.1 (.NET Framework) the stdin writer writes a
          # byte-order mark the moment the process starts, which turned
          # `initialize` into a line no JSON-RPC client would send (measured
          # on this job: tools/list answered, initialize did not).
          $msgs = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"claude-ai","version":"0.1"}}}' + "`n" +
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' + "`n" +
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' + "`n"
          $bytes = $utf8.GetBytes($msgs)
          $p.StandardInput.BaseStream.Write($bytes, 0, $bytes.Length)
          $p.StandardInput.BaseStream.Flush()
          Start-Sleep -Seconds 8
          $p.StandardInput.BaseStream.Close()
          if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force; [void]$p.WaitForExit(5000) }
          $out = $outTask.Result; $err = $errTask.Result
          Write-Host "exit code: $($p.ExitCode)"
          Write-Host '----- stderr -----'; Write-Host $err
          $lines = @($out -split "`n" | Where-Object { $_.Trim() })
          $init = $null; $list = $null
          foreach ($l in $lines) { try { $m = $l | ConvertFrom-Json } catch { Write-Host "not JSON on stdout: $($l.Substring(0, [Math]::Min(200, $l.Length)))"; continue }; if ($m.id -eq 1) { $init = $m }; if ($m.id -eq 2) { $list = $m } }
          if (-not $init -or $init.result.serverInfo.name -ne 'my-curator') { Write-Host '----- stdout -----'; Write-Host $out; throw 'the bridge did not answer initialize' }
          $n = @($list.result.tools).Count
          if ($n -lt 1) { Write-Host '----- stdout -----'; Write-Host $out; throw 'the bridge listed no tools' }
          Write-Host "initialize answered by $($init.result.serverInfo.name); tools/list: $n tools (private node, absolute server.js, cwd System32, SDK default env)"

      - name: Start, check, stop (the desktop-icon scripts)
        shell: powershell
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = $env:CI_CURATOR_DIR
          $start = Join-Path $dir 'scripts\windows\start-curator.ps1'
          $stop = Join-Path $dir 'scripts\windows\stop-curator.ps1'
          $port = 3399
          $needle = (Join-Path $dir 'src\server.js').ToLowerInvariant()
          function Get-Servers { @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.CommandLine -and $_.CommandLine.Replace('/', '\').ToLowerInvariant().Contains($needle) }) }
          function Get-Version { param($h) try { (Invoke-RestMethod -Uri "http://${h}:$port/api/version" -TimeoutSec 5 -UseBasicParsing).version } catch { $null } }
          function Test-Free { $l = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, $port); try { $l.Start(); $true } catch { $false } finally { try { $l.Stop() } catch { } } }
          function Show-Log { $log = Join-Path $env:LOCALAPPDATA 'TheCurator\logs\server.log'; if (Test-Path -LiteralPath $log) { Write-Host '----- server.log -----'; Get-Content -LiteralPath $log -Tail 80 } }

          # The scripts honour a PORT in the checkout's .env (src/server.js reads it via dotenv).
          [System.IO.File]::WriteAllText((Join-Path $dir '.env'), "PORT=$port`r`n# planted by CI`r`n", (New-Object System.Text.UTF8Encoding($false)))
          $want = (Get-Content -Raw -LiteralPath (Join-Path $dir 'package.json') | ConvertFrom-Json).version

          # A node process that is NOT The Curator: Stop must leave it alone.
          $decoy = Start-Process -FilePath node -ArgumentList '-e', '"setInterval(function(){},1000)"' -PassThru -WindowStyle Hidden

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $start
          if ($LASTEXITCODE -ne 0) { Show-Log; throw "start-curator.ps1 failed ($LASTEXITCODE)" }
          $v = Get-Version '127.0.0.1'
          if ($v -ne $want) { Show-Log; throw "/api/version answered '$v', expected '$want'" }
          if ((Get-Version 'localhost') -ne $want) { throw '/api/version did not answer on localhost' }
          $s = @(Get-Servers)
          if ($s.Count -ne 1) { throw "expected 1 server process, found $($s.Count)" }
          $privNode = Join-Path $env:LOCALAPPDATA 'TheCurator\runtime\node\node.exe'
          if ($s[0].ExecutablePath -ne $privNode) { throw "the server runs on $($s[0].ExecutablePath), not the private node $privNode" }
          Write-Host "running: v$v, process $($s[0].ProcessId), $($s[0].ExecutablePath)"

          # Double-click again: no second server.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $start
          if ($LASTEXITCODE -ne 0) { throw "second start failed ($LASTEXITCODE)" }
          if (@(Get-Servers).Count -ne 1) { throw 'a second start launched a second server' }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $stop
          if ($LASTEXITCODE -ne 0) { throw "stop-curator.ps1 failed ($LASTEXITCODE)" }
          if (@(Get-Servers).Count -ne 0) { throw 'a server process is still running after Stop' }
          if (Get-Version '127.0.0.1') { throw 'The Curator still answers after Stop' }
          if (-not (Test-Free)) { throw "port $port is not free after Stop" }
          if ($decoy.HasExited) { throw 'Stop killed a node process that is not The Curator' }
          Write-Host 'stopped; port free; the other node process is untouched'

          $out = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $stop) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $out -notmatch 'was not running') { throw "second stop: $out" }

          # Port taken by another program: a plain-words refusal, exit code 1.
          $blocker = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, $port)
          $blocker.Start()
          try {
            $out = (& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $start) -join "`n"
            $code = $LASTEXITCODE
          } finally { $blocker.Stop() }
          Write-Host $out
          if ($code -ne 1 -or $out -notmatch 'already used by another program') { throw "port-in-use start: exit $code" }
          if (@(Get-Servers).Count -ne 0) { throw 'a server was left running after the port-in-use refusal' }
          Stop-Process -Id $decoy.Id -Force
          # The runner exits the step with $LASTEXITCODE, which is still the 1 of
          # the refusal above (the expected outcome).
          $global:LASTEXITCODE = 0

      - name: Second install = repair (PowerShell 7, without -NoStart)
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = $env:CI_CURATOR_DIR
          $port = 3399
          $rt = Join-Path $env:LOCALAPPDATA 'TheCurator\runtime'
          $git = Join-Path $rt 'git\cmd\git.exe'

          # The user's data, planted: it must come through byte-identical.
          $wiki = Join-Path $dir 'domains\x\wiki'
          [void][System.IO.Directory]::CreateDirectory($wiki)
          [byte[]]$bytes = @(0xEF, 0xBB, 0xBF) + [System.Text.Encoding]::UTF8.GetBytes("# A page`r`n`r`n" + [char]0x017D + "iga's note, [[b]]`n")
          [System.IO.File]::WriteAllBytes((Join-Path $wiki 'a.md'), $bytes)
          [System.IO.File]::WriteAllText((Join-Path $dir '.curator-config.json'), '{"planted": true}')
          $guarded = @((Join-Path $wiki 'a.md'), (Join-Path $dir '.env'), (Join-Path $dir '.curator-config.json'))
          $before = @{}
          foreach ($f in $guarded) { $before[$f] = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash }
          $headBefore = (& $git -C $dir rev-parse HEAD)

          # Break things a re-run must repair.
          Remove-Item -LiteralPath (Join-Path $rt 'node\node.exe') -Force
          Remove-Item -LiteralPath (Join-Path ([Environment]::GetFolderPath('Desktop')) 'The Curator.lnk') -Force
          Remove-Item -LiteralPath (Join-Path $dir 'src\server.js') -Force

          & ([scriptblock]::Create((Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'install.ps1')))) -Branch $env:CI_CURATOR_BRANCH -InstallDir $dir -RepoUrl $env:CI_CURATOR_REPO
          if ($LASTEXITCODE -ne 0) { throw "the repair run reported failure ($LASTEXITCODE)" }

          foreach ($f in $guarded) {
            if ((Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash -ne $before[$f]) { throw "the repair run changed $f" }
          }
          foreach ($p in @((Join-Path $rt 'node\node.exe'), (Join-Path ([Environment]::GetFolderPath('Desktop')) 'The Curator.lnk'), (Join-Path $dir 'src\server.js'))) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "not repaired: $p" }
          }
          $headAfter = (& $git -C $dir rev-parse HEAD)
          if ($headAfter -ne $headBefore) { Write-Host "::notice::the repair run fast-forwarded $headBefore -> $headAfter" }
          $log = Get-Content -Raw -LiteralPath (Join-Path $env:LOCALAPPDATA 'TheCurator\logs\install.log')
          if ($log -notmatch 'Git [0-9.]+windows\.[0-9]+ is already installed and works') { throw 'the repair run re-installed Git, which was intact' }
          if ($log -notmatch 'Components are already installed') { throw 'the repair run re-ran npm, which was not needed' }

          # Without -NoStart the installer started the app and RETURNED.
          $v = (Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/version" -TimeoutSec 5).version
          Write-Host "running after the repair run: v$v"

          # The icon scripts also run under PowerShell 7.
          & pwsh -NoProfile -File (Join-Path $dir 'scripts\windows\stop-curator.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'stop under pwsh failed' }
          & pwsh -NoProfile -File (Join-Path $dir 'scripts\windows\start-curator.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'start under pwsh failed' }
          & pwsh -NoProfile -File (Join-Path $dir 'scripts\windows\stop-curator.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'second stop under pwsh failed' }
          $l = New-Object System.Net.Sockets.TcpListener([System.Net.IPAddress]::Loopback, $port)
          $l.Start(); $l.Stop()
          Write-Host 'repair run OK; data byte-identical; port free'

      - name: Logs
        if: always()
        shell: pwsh
        run: |
          $logs = Join-Path $env:LOCALAPPDATA 'TheCurator\logs'
          foreach ($f in @('install.log.1', 'install.log', 'server.log.1', 'server.log')) {
            $p = Join-Path $logs $f
            if (Test-Path -LiteralPath $p) { Write-Host "===== $f ====="; Get-Content -LiteralPath $p -Tail 150 }
          }
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object { $_.CommandLine -match 'server\.js' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

  # ── Live tests: real Gemini/Anthropic calls (cost ≈ a few cents). ───────────
  # Runs ONLY on a push to main or a manual run — NEVER on pull requests, so a
  # community fork can never reach the API-key secrets. `needs: offline` means we
  # don't spend a cent if the free tests already failed. On CI the runner sets
  # CI=true, so run-tests.js automatically excludes the local-only suites
  # (real-data / quality-benchmark / server-spawning) and runs only LIVE_CI.
  #
  # This `if:` also means `live` does NOT run on a `release/v*` branch, so it is
  # not part of `scripts/release.js`'s gate — deliberately. It spends real money,
  # can take 20 minutes, and is explicitly flake-tolerant via scripts/ci-flake.js;
  # a required check designed to tolerate its own transient failures is the wrong
  # thing to block a green tree on. It still runs here on the post-merge push to
  # `main`, exactly as before, and `release.js --watch-main` waits for it and
  # reports it WITHOUT changing the release's exit code. If you ever want live in
  # the gate, widen this `if:` to cover `refs/heads/release/` AND accept that a
  # provider 503 will then hold up a release.
  live:
    name: Live API tests (Gemini + Anthropic)
    runs-on: ubuntu-latest
    needs: offline
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          # FULL history, not the default shallow clone. `test-build-model.js`
          # proves the model resolver is byte-identical to its pre-release
          # baseline by extracting that baseline with `git show <sha>:file` and
          # running both side by side over 20 config shapes x 11 call shapes.
          # A depth-1 checkout has ONE commit, so the blob is unreachable and
          # the suite fails on CI while passing locally — which is what happened
          # on 2026-08-29. The suite is right to fail loudly rather than skip:
          # a guard that quietly opts out on CI is the one place it matters most.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional — only if you later add a throwaway GitHub test repo + PAT.
          # When absent, the GitHub-backed live suites self-skip (exit 0).
          GITHUB_TEST_REPO: ${{ secrets.GITHUB_TEST_REPO }}
          GITHUB_TEST_PAT: ${{ secrets.GITHUB_TEST_PAT }}

  # ── Dependency audit: advisory only, never gates anything. ──────────────────
  # `main` has no branch protection and no rulesets (verified via
  # `gh api repos/.../branches/main/protection` → 404 "Branch not protected",
  # and `gh api repos/.../rulesets` → `[]`), so NO job in this workflow —
  # including `offline`, described above as "the required gate" — can actually
  # block a push or a merge today. Given that, `continue-on-error: true` on this
  # step would buy nothing that isn't already true, and it has a real cost:
  # GitHub does not send its default "workflow run failed" notification for a
  # step marked continue-on-error, so a real advisory would surface only as a
  # small warning triangle in the Actions list that someone has to go looking
  # for — which is exactly the failure mode this job exists to close (external
  # scanners found the fast-uri/multer advisories via PRs #7/#8 before this
  # project noticed on its own). So this step is left free to fail for real: a
  # red check + the default failure email, with nothing downstream depending on
  # it (no `needs:` points at this job, and no branch protection exists to make
  # a red check block anything). If branch protection is ever added to `main`,
  # explicitly EXCLUDE "Dependency audit" from the required-checks list to keep
  # it advisory rather than blocking.
  #
  # Caveat, measured 2026-08-30, not asserted: `npm audit` reads GitHub's
  # ecosystem-wide (npm) advisory feed, which lags the per-package repo-level
  # advisory list. `fast-uri` carried 9 HIGH severity advisories at the repo
  # level (`gh api /repos/fastify/fast-uri/security-advisories`) but only 5 of
  # those were present in the feed `npm audit` actually queries
  # (`gh api "/advisories?ecosystem=npm&affects=fast-uri"`) — so at the time of
  # the v3.1.2 fast-uri incident, `npm audit` would have printed
  # "found 0 vulnerabilities" while 4 open HIGH advisories affecting <3.1.6
  # stood unreported. A clean run here is a tripwire for the common case, NOT
  # proof the dependency tree is clean.
  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
