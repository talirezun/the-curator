<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 110 110" width="110" height="110" role="img" aria-label="The Curator"><title>The Curator</title>
  <!-- REDUCED RAIL/FAVICON MARK (v3.49.0). The full mark (images/mark-on-*.svg
       and assets/mark-small-on-*.svg) is 40 nodes and 100 edges; at the 28px
       the rail draws it, its 1.9-unit strokes land at 0.53 device pixels and
       the network reads as texture rather than as a network. This variant
       keeps the SAME SILHOUETTE — all ten node coordinates below are copied
       verbatim from the full mark, chosen from its convex hull plus the three
       accent nodes — and the SAME COLOURS, on 14 edges with a 5.5-unit stroke
       (1.6 device px at 32px). The viewBox is inset by 5 units on every side
       so the heavier stroke and the larger nodes have somewhere to sit
       WITHOUT any coordinate moving. Do not use this above ~48px; the full
       mark is the one for README, about and the DMG. -->
  <g stroke="#EDEDF4" stroke-width="5.5" stroke-linecap="round">
    <line x1="47.95" y1="9.92" x2="17.6" y2="18.89"></line>
    <line x1="17.6" y1="18.89" x2="4" y2="38.9"></line>
    <line x1="4" y1="38.9" x2="12.3" y2="54.38"></line>
    <line x1="17.6" y1="18.89" x2="21.74" y2="32.03"></line>
    <line x1="4" y1="38.9" x2="21.74" y2="32.03"></line>
    <line x1="21.74" y1="32.03" x2="49.41" y2="65.98"></line>
    <line x1="12.3" y1="54.38" x2="49.41" y2="65.98"></line>
    <line x1="47.95" y1="9.92" x2="82.91" y2="22"></line>
    <line x1="82.91" y1="22" x2="96" y2="50.99"></line>
    <line x1="82.91" y1="22" x2="79.54" y2="41.9"></line>
    <line x1="96" y1="50.99" x2="79.54" y2="41.9"></line>
    <line x1="79.54" y1="41.9" x2="49.41" y2="65.98"></line>
    <line x1="49.41" y1="65.98" x2="63.6" y2="90.08"></line>
    <line x1="96" y1="50.99" x2="63.6" y2="90.08"></line>
  </g>
  <g fill="#EDEDF4">
    <circle cx="47.95" cy="9.92" r="4.2"></circle>
    <circle cx="17.6" cy="18.89" r="4.2"></circle>
    <circle cx="4" cy="38.9" r="4.2"></circle>
    <circle cx="12.3" cy="54.38" r="4.2"></circle>
    <circle cx="82.91" cy="22" r="4.2"></circle>
    <circle cx="96" cy="50.99" r="4.2"></circle>
    <circle cx="63.6" cy="90.08" r="4.2"></circle>
  </g>
  <circle cx="21.74" cy="32.03" r="6.5" fill="#3FBFD8"></circle>
  <circle cx="79.54" cy="41.9" r="6.5" fill="#79C752"></circle>
  <circle cx="49.41" cy="65.98" r="6.5" fill="#E0A33A"></circle>
</svg>
