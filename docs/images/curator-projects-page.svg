  <text class="m" x="532" y="322">7 when needed</text>
  <rect class="btn" x="680" y="284" width="34" height="20" rx="5"/>
  <text class="btntxt" x="697" y="298" text-anchor="middle">Add</text>

  <rect class="inner" x="520" y="332" width="204" height="52" rx="8"/>
  <text class="t" x="532" y="352">Knowledge</text>
  <circle cx="536" cy="365" r="4" fill="var(--id-a)"/>
