  <text class="m" x="42" y="34">Work / my-app</text>
  <text class="h1" x="24" y="64">my-app</text>
  <text class="s" x="24" y="90">Claude Code saved a note 27 min ago on this Mac. Antigravity needs one step from you.</text>
  <rect class="btnp" x="556" y="44" width="140" height="28" rx="7"/>
  <text class="btnptxt" x="626" y="62" text-anchor="middle">+ Connect an agent</text>
  <rect class="btn" x="704" y="44" width="34" height="28" rx="7"/>
  <text class="btntxt" x="721" y="62" text-anchor="middle">···</text>
  <text class="cap" x="556" y="90">HEADER · ONE SENTENCE</text>

  <!-- ── TABS ───────────────────────────────────────────────────── -->
  <line class="rule" x1="24" y1="132" x2="736" y2="132"/>
  <text class="tab" x="24" y="124">Now</text>
  <line x1="22" y1="131" x2="54" y2="131" stroke="var(--violet)" stroke-width="2.5"/>
  <text class="tab" x="78" y="124">Agents 3</text>
  <text class="tab" x="152" y="124">Starting kit</text>
  <line class="rule" x1="246" y1="110" x2="246" y2="128"/>
  <rect class="proline" x="258" y="108" width="246" height="22" rx="6"/>
  <text class="tabpro" x="270" y="124">History 45</text>
  <text class="tabpro" x="354" y="124">Budget</text>
  <text class="tabpro" x="410" y="124">Computers 2</text>
  <text class="cap" x="516" y="124">← PRO ADDS THESE THREE</text>

  <!-- ── PANEL: NOW ─────────────────────────────────────────────── -->
  <rect class="card" x="24" y="150" width="228" height="430" rx="10"/>
  <text class="cap" x="38" y="172">NOW</text>
  <text class="m" x="38" y="190">Where the work stands — the note</text>
  <text class="m" x="38" y="204">the last agent left.</text>
  <rect class="inner" x="36" y="216" width="204" height="210" rx="8"/>
  <text class="t" x="48" y="238">Checkout flow: tests green,</text>
  <text class="t" x="48" y="253">payment retry still open</text>
  <text class="cap" x="48" y="276">WHERE THINGS STAND</text>
  <text class="m" x="48" y="292">• Cart and address steps done</text>
  <text class="m" x="48" y="307">• Retry fails on the 2nd attempt</text>
  <text class="cap" x="48" y="330">NEXT STEPS</text>
  <text class="m" x="48" y="346">• Fix the token refresh</text>
  <line class="rule" x1="48" y1="362" x2="228" y2="362"/>
  <text class="m" x="48" y="380">Saved · Claude Code · this Mac</text>
  <text class="m" x="48" y="394">· 27 min ago</text>
  <text class="link" x="48" y="414">Open the full note ›</text>
  <rect class="btn" x="36" y="436" width="204" height="24" rx="6"/>
  <text class="btntxt" x="138" y="452" text-anchor="middle">Copy “continue” prompt</text>
  <text class="cap" x="38" y="484">EARLIER NOTES</text>
  <rect class="inner" x="36" y="494" width="204" height="38" rx="6"/>
  <text class="t" x="46" y="510">Address step done</text>
  <text class="m" x="46" y="524">Claude Code · this Mac · yesterday</text>
  <rect class="inner" x="36" y="536" width="204" height="38" rx="6"/>
  <text class="t" x="46" y="552">Project set up</text>
  <text class="m" x="46" y="566">Cursor · studio-mac · 3 days ago</text>

  <!-- ── PANEL: AGENTS ──────────────────────────────────────────── -->
  <rect class="card" x="266" y="150" width="228" height="430" rx="10"/>
  <text class="cap" x="280" y="172">AGENTS</text>
  <text class="m" x="280" y="190">The agents that can open this</text>
  <text class="m" x="280" y="204">project’s notes.</text>

  <rect class="inner" x="278" y="216" width="204" height="52" rx="8"/>
  <text class="t" x="290" y="236">Claude Code</text>
  <text class="m" x="290" y="252">saved 27 min ago</text>
  <rect class="chip-ok" x="418" y="226" width="54" height="18" rx="9"/>
  <text class="ok" x="445" y="239" text-anchor="middle">● Ready</text>

  <rect class="inner" x="278" y="274" width="204" height="68" rx="8"/>
