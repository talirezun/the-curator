<svg viewBox="0 0 760 700" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="curator-projects-page-title curator-projects-page-desc">
  <title id="curator-projects-page-title">The Projects page — a header, one status sentence and a tab strip</title>
  <desc id="curator-projects-page-desc">
    A wireframe of one project on the Projects page (v4.3.0). At the top, the header: a kicker with
    the domain's identity dot reading "Work / my-app", the project's name "my-app", and one status
    sentence, "Claude Code saved a note 27 min ago on this Mac. Antigravity needs one step from
    you." To the right, the one primary button "+ Connect an agent" and a "···" menu. Under it the
    tab strip. The three tabs every view shows are drawn solid: Now, Agents and Starting kit. The
    three tabs Pro adds are drawn dashed after a gap: History, Budget and Computers. Below, three
    panels side by side, one per Simple tab, each headed by its one sentence. Now: "Where the work
    stands — the note the last agent left", a card with the note's headline and its sections, a
    footer reading "Saved · Claude Code · this Mac · 27 min ago" with "Open the full note", and a
    "Copy continue prompt" button, then two Earlier notes rows. Agents: "The agents that can open
    this project's notes", three rows each with one status chip — Claude Code Ready, Antigravity
    Needs you (its fix is in a notice below the rows, so the row carries no button of its own), OpenCode Not connected with Continue — and an information
    notice "14 files are only on this computer" with Sync now. Starting kit: "What every agent
    reads before it does anything", three rows — Brief with Edit, Documents with Add, Knowledge with
    Add a domain — and one bar, "The starting kit uses 3% of your agent's memory — plenty of room
    left". At the foot, a quiet line "More in Pro: the latest note of each work-stream, the token
    budget, your computers. Turn on Pro", and a caption: in Simple, three tabs that each answer one question;
    in Pro, the same three widen into tables and three more tabs appear; a warning, a cost, a
    refusal or an outcome is never only in Pro.
  </desc>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --text-2: #57606a;
      --accent: #2f6fed;
      --violet: #8250df;
      --ok: #1a7f37;
      --attn: #9a6700;
      --off: #6e7781;
      --id-a: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --text-2: #9198a1;
        --accent: #6ea8ff;
        --violet: #c8a6ff;
        --ok: #4ac26b;
        --attn: #d4a72c;
        --off: #9198a1;
        --id-a: #f778ba;
      }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .inner { fill: var(--bg); stroke: var(--border); stroke-width: 1.2; }
    .rule { stroke: var(--border); stroke-width: 1.2; }
    .h1 { font: 700 20px system-ui, sans-serif; fill: var(--text); }
    .h { font: 700 13px system-ui, sans-serif; fill: var(--text); }
    .t { font: 600 12px system-ui, sans-serif; fill: var(--text); }
    .m { font: 400 11px system-ui, sans-serif; fill: var(--text-2); }
    .s { font: 400 12.5px system-ui, sans-serif; fill: var(--text); }
    .cap { font: 700 9.5px system-ui, sans-serif; fill: var(--text-2); letter-spacing: .1em; }
    .tab { font: 600 12.5px system-ui, sans-serif; fill: var(--text); }
    .tabpro { font: 600 12.5px system-ui, sans-serif; fill: var(--text-2); }
    .proline { fill: none; stroke: var(--text-2); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .btnp { fill: var(--violet); }
    .btnptxt { font: 600 12px system-ui, sans-serif; fill: #ffffff; }
    .btn { fill: var(--bg); stroke: var(--border); stroke-width: 1.2; }
    .btntxt { font: 600 10.5px system-ui, sans-serif; fill: var(--text); }
    .link { font: 600 10.5px system-ui, sans-serif; fill: var(--violet); }
    .chip-ok { fill: none; stroke: var(--ok); stroke-width: 1.2; }
    .chip-attn { fill: none; stroke: var(--attn); stroke-width: 1.2; }
    .chip-off { fill: none; stroke: var(--off); stroke-width: 1.2; stroke-dasharray: 2 2; }
    .ok { font: 600 10px system-ui, sans-serif; fill: var(--ok); }
    .attn { font: 600 10px system-ui, sans-serif; fill: var(--attn); }
    .off { font: 600 10px system-ui, sans-serif; fill: var(--off); }
    .bar { fill: var(--border); }
    .barfill { fill: var(--violet); }
    .foot { font: 400 12px system-ui, sans-serif; fill: var(--text-2); }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="700"/>

  <!-- ── HEADER ─────────────────────────────────────────────────── -->
