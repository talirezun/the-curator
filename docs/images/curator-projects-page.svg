  <rect class="inner" x="278" y="348" width="204" height="68" rx="8"/>
  <text class="t" x="290" y="368">OpenCode</text>
  <text class="m" x="290" y="384">2 of 3 steps left</text>
  <rect class="chip-off" x="384" y="358" width="88" height="18" rx="9"/>
  <text class="off" x="428" y="371" text-anchor="middle">○ Not connected</text>
  <rect class="btn" x="404" y="388" width="68" height="20" rx="5"/>
  <text class="btntxt" x="438" y="402" text-anchor="middle">Continue</text>

  <rect class="inner" x="278" y="428" width="204" height="70" rx="8"/>
  <text class="t" x="290" y="448">14 files are only on this computer.</text>
  <text class="m" x="290" y="466">Your other computers see</text>
  <text class="m" x="290" y="480">the newest note after</text>
  <text class="m" x="290" y="493">you sync.</text>
  <rect class="btn" x="404" y="470" width="68" height="20" rx="5"/>
  <text class="btntxt" x="438" y="484" text-anchor="middle">Sync now</text>
  <text class="cap" x="280" y="524">ONE ROW PER AGENT:</text>
  <text class="m" x="280" y="540">one status, at most one action;</text>
  <text class="m" x="280" y="554">the row opens its steps in the</text>
  <text class="m" x="280" y="568">reader on the right</text>

