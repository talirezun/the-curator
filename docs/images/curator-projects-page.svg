  <rect class="btn" x="636" y="338" width="78" height="18" rx="5"/>
  <text class="btntxt" x="675" y="351" text-anchor="middle">Add a domain</text>

  <rect class="inner" x="520" y="396" width="204" height="70" rx="8"/>
  <text class="t" x="532" y="416">The starting kit uses 3% of</text>
  <text class="t" x="532" y="431">your agent’s memory</text>
  <text class="m" x="532" y="446">plenty of room left</text>
  <rect class="bar" x="532" y="453" width="180" height="6" rx="3"/>
  <rect class="barfill" x="532" y="453" width="8" height="6" rx="3"/>
  <text class="cap" x="522" y="494">ALWAYS READ · WHEN NEEDED ·</text>
  <text class="cap" x="522" y="508">HIDDEN</text>
  <text class="m" x="522" y="526">the three start states a</text>
  <text class="m" x="522" y="540">document can have</text>

  <!-- ── FOOT ───────────────────────────────────────────────────── -->
  <text class="foot" x="24" y="606">More in Pro: the latest note of each work-stream, the token budget, your computers.</text>
  <text class="link" x="540" y="606">Turn on Pro ›</text>
  <line class="rule" x1="24" y1="622" x2="736" y2="622"/>
  <text class="foot" x="24" y="646">Simple: three tabs, each answering one question. Pro: the same three widen into tables, and History,</text>
  <text class="foot" x="24" y="664">Budget and Computers appear. Two layouts, one data model — a warning, a cost, a refusal or an</text>
  <text class="foot" x="24" y="682">outcome is never only in Pro, and every task can be finished in Simple.</text>
</svg>
